<script>
(function () {
  var root = document.documentElement;
  var panel = document.getElementById("a11y-panel");
  var toggle = document.getElementById("a11y-toggle");

  toggle.addEventListener("click", function () {
    panel.classList.toggle("abierto");
  });
  document.addEventListener("click", function (e) {
    if (!panel.contains(e.target) && e.target !== toggle) panel.classList.remove("abierto");
  });

  var FONT_STEPS = [80, 90, 100, 112, 125, 140, 160, 180, 200];
  var fontIdx = 2;

  var SANS = "-apple-system, \"Helvetica Neue\", Arial, sans-serif";
  var SERIF = "\"Georgia\", \"Times New Roman\", serif";

  var settings = {
    fontscale: 100,
    lineheight: "1.6",
    fontfamily: "serif",
    width: "860"
  };

  function load(key, fallback) {
    var v = localStorage.getItem("mit803-" + key);
    return v === null ? fallback : v;
  }
  function save(key, value) {
    localStorage.setItem("mit803-" + key, value);
  }

  function applyAll() {
    root.style.fontSize = settings.fontscale + "%";
    root.style.setProperty("--line-height", settings.lineheight);
    root.style.setProperty("--font-family", settings.fontfamily === "sans" ? SANS : SERIF);
    root.style.setProperty("--content-width", settings.width + "px");
    markActive();
  }

  function markActive() {
    document.querySelectorAll(".a11y-btns[data-group]").forEach(function (group) {
      var name = group.dataset.group;
      var current = name === "fontscale" ? null : String(settings[name]);
      group.querySelectorAll("button").forEach(function (btn) {
        btn.classList.toggle("activo", name !== "fontscale" && btn.dataset.value === current);
      });
    });
  }

  settings.fontscale = parseInt(load("fontscale", "100"), 10);
  fontIdx = FONT_STEPS.indexOf(settings.fontscale);
  if (fontIdx === -1) { fontIdx = 2; settings.fontscale = 100; }
  settings.lineheight = load("lineheight", "1.6");
  settings.fontfamily = load("fontfamily", "serif");
  settings.width = load("width", "860");
  applyAll();

  document.querySelectorAll(".a11y-btns[data-group]").forEach(function (group) {
    var name = group.dataset.group;
    group.querySelectorAll("button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (name === "fontscale") {
          var action = btn.dataset.value;
          if (action === "up") fontIdx = Math.min(fontIdx + 1, FONT_STEPS.length - 1);
          else if (action === "down") fontIdx = Math.max(fontIdx - 1, 0);
          else fontIdx = 2;
          settings.fontscale = FONT_STEPS[fontIdx];
          save("fontscale", settings.fontscale);
        } else {
          settings[name] = btn.dataset.value;
          save(name, settings[name]);
        }
        applyAll();
      });
    });
  });
})();
</script>
<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById("theme-toggle");
  var KEY = "mit-tema";
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  function setIcon(theme) {
    btn.textContent = theme === "dark" ? "\u2600\uFE0F" : "\uD83C\uDF19";
    btn.setAttribute("aria-label", theme === "dark" ? "Cambiar a tema claro" : "Cambiar a tema oscuro");
  }
  setIcon(root.getAttribute("data-theme"));

  btn.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    localStorage.setItem(KEY, next);
    root.setAttribute("data-theme", next);
    setIcon(next);
  });

  if (mq) {
    mq.addEventListener("change", function (e) {
      if (!localStorage.getItem(KEY)) {
        var theme = e.matches ? "dark" : "light";
        root.setAttribute("data-theme", theme);
        setIcon(theme);
      }
    });
  }
})();
</script>
<script>
(function () {
  var fp = document.getElementById("fp");
  var fpBar = document.getElementById("fp-bar");
  var fpTitle = document.getElementById("fp-title");
  var fpIframe = document.getElementById("fp-iframe");
  var fpMin = document.getElementById("fp-min");
  var fpClose = document.getElementById("fp-close");

  function openVideo(vid, title) {
    fpIframe.src = "https://www.youtube.com/embed/" + vid + "?autoplay=1";
    fpIframe.title = title;
    fpTitle.textContent = title;
    fp.hidden = false;
    fp.classList.remove("minimizado");
  }
  function closeVideo() {
    fp.hidden = true;
    /* Cambiar el src no basta: Firefox mantiene vivo el reproductor de
       YouTube y el vídeo se sigue oyendo. Hay que sacar el iframe del
       documento y poner otro nuevo en su lugar. */
    var limpio = fpIframe.cloneNode(false);
    limpio.removeAttribute("src");
    limpio.removeAttribute("title");
    fpIframe.parentNode.replaceChild(limpio, fpIframe);
    fpIframe = limpio;
  }

  document.querySelectorAll(".video-play").forEach(function (btn) {
    btn.addEventListener("click", function () {
      openVideo(btn.dataset.vid, btn.dataset.title);
    });
  });
  fpClose.addEventListener("click", closeVideo);
  fpMin.addEventListener("click", function () {
    fp.classList.toggle("minimizado");
  });

  /* arrastrar el reproductor flotante */
  var dragging = false, offX = 0, offY = 0;
  function startDrag(x, y) {
    dragging = true;
    var r = fp.getBoundingClientRect();
    offX = x - r.left;
    offY = y - r.top;
    fp.style.right = "auto";
    fp.style.bottom = "auto";
    fp.style.left = r.left + "px";
    fp.style.top = r.top + "px";
  }
  function moveDrag(x, y) {
    if (!dragging) return;
    var w = fp.offsetWidth, h = fp.offsetHeight;
    var left = Math.min(Math.max(0, x - offX), window.innerWidth - w);
    var top = Math.min(Math.max(0, y - offY), window.innerHeight - h);
    fp.style.left = left + "px";
    fp.style.top = top + "px";
  }
  function endDrag() { dragging = false; }

  fpBar.addEventListener("mousedown", function (e) { startDrag(e.clientX, e.clientY); });
  window.addEventListener("mousemove", function (e) { moveDrag(e.clientX, e.clientY); });
  window.addEventListener("mouseup", endDrag);

  fpBar.addEventListener("touchstart", function (e) {
    var t = e.touches[0]; startDrag(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener("touchmove", function (e) {
    var t = e.touches[0]; moveDrag(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener("touchend", endDrag);
})();
</script>
