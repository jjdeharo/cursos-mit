<script>
(function () {
  var root = document.documentElement;
  var panel = document.getElementById("a11y-panel");
  var toggle = document.getElementById("a11y-toggle");

  toggle.addEventListener("click", function () {
    panel.classList.toggle("abierto");
  });
  document.addEventListener("click", function (e) {
    if (!panel.contains(e.target) && e.target !== toggle) panel.classList.remove("abierto");
  });

  /* Pasos de ~5 % alrededor del 100 %, que se van abriendo en los extremos:
     saltos menores dan un ajuste fino donde de verdad se lee. */
  var FONT_STEPS = [75, 80, 85, 90, 95, 100, 105, 110, 115, 120, 130, 140, 150, 165, 180, 200];
  var BASE_IDX = FONT_STEPS.indexOf(100);
  var fontIdx = BASE_IDX;

  var SANS = "-apple-system, \"Helvetica Neue\", Arial, sans-serif";
  var SERIF = "\"Georgia\", \"Times New Roman\", serif";

  var settings = {
    fontscale: 100,
    lineheight: "1.6",
    fontfamily: "serif",
    width: "860"
  };

  function load(key, fallback) {
    var v = localStorage.getItem("mit803-" + key);
    return v === null ? fallback : v;
  }
  function save(key, value) {
    localStorage.setItem("mit803-" + key, value);
  }

  function applyAll() {
    root.style.fontSize = settings.fontscale + "%";
    root.style.setProperty("--line-height", settings.lineheight);
    root.style.setProperty("--font-family", settings.fontfamily === "sans" ? SANS : SERIF);
    root.style.setProperty("--content-width", settings.width + "px");
    markActive();
  }

  function markActive() {
    document.querySelectorAll(".a11y-btns[data-group]").forEach(function (group) {
      var name = group.dataset.group;
      var current = name === "fontscale" ? null : String(settings[name]);
      group.querySelectorAll("button").forEach(function (btn) {
        btn.classList.toggle("activo", name !== "fontscale" && btn.dataset.value === current);
      });
    });
  }

  settings.fontscale = parseInt(load("fontscale", "100"), 10);
  fontIdx = FONT_STEPS.indexOf(settings.fontscale);
  if (fontIdx === -1) {
    /* Guardado con una escala anterior: se lleva al paso más próximo. */
    fontIdx = BASE_IDX;
    for (var i = 0; i < FONT_STEPS.length; i++) {
      if (Math.abs(FONT_STEPS[i] - settings.fontscale) < Math.abs(FONT_STEPS[fontIdx] - settings.fontscale)) fontIdx = i;
    }
    settings.fontscale = FONT_STEPS[fontIdx];
  }
  settings.lineheight = load("lineheight", "1.6");
  settings.fontfamily = load("fontfamily", "serif");
  settings.width = load("width", "860");
  applyAll();

  document.querySelectorAll(".a11y-btns[data-group]").forEach(function (group) {
    var name = group.dataset.group;
    group.querySelectorAll("button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (name === "fontscale") {
          var action = btn.dataset.value;
          if (action === "up") fontIdx = Math.min(fontIdx + 1, FONT_STEPS.length - 1);
          else if (action === "down") fontIdx = Math.max(fontIdx - 1, 0);
          else fontIdx = BASE_IDX;
          settings.fontscale = FONT_STEPS[fontIdx];
          save("fontscale", settings.fontscale);
        } else {
          settings[name] = btn.dataset.value;
          save(name, settings[name]);
        }
        applyAll();
      });
    });
  });
})();
</script>
<script>
(function () {
  /* Tres modos: "auto" sigue al sistema (no se guarda nada), "light" y
     "dark" son una elección manual que se recuerda en este navegador. */
  var root = document.documentElement;
  var btn = document.getElementById("theme-toggle");
  var KEY = "mit-tema";
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  var MODOS = ["auto", "light", "dark"];
  var ICONO = { auto: "\uD83C\uDF17", light: "\u2600\uFE0F", dark: "\uD83C\uDF19" };
  var NOMBRE = { auto: "autom\u00e1tico (el del sistema)", light: "claro", dark: "oscuro" };

  function modo() {
    var v = localStorage.getItem(KEY);
    return MODOS.indexOf(v) === -1 ? "auto" : v;
  }

  function aplicar() {
    var m = modo();
    root.setAttribute("data-theme", m === "auto" ? (mq && mq.matches ? "dark" : "light") : m);
    if (!btn) return;
    btn.textContent = ICONO[m];
    var etiqueta = "Tema: " + NOMBRE[m] + ". Pulsa para cambiarlo.";
    btn.title = etiqueta;
    btn.setAttribute("aria-label", etiqueta);
  }

  aplicar();

  if (btn) {
    btn.addEventListener("click", function () {
      var siguiente = MODOS[(MODOS.indexOf(modo()) + 1) % MODOS.length];
      if (siguiente === "auto") localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, siguiente);
      aplicar();
    });
  }

  /* El sistema cambia de tema: solo se nota si el modo es "auto". */
  if (mq) {
    if (mq.addEventListener) mq.addEventListener("change", aplicar);
    else if (mq.addListener) mq.addListener(aplicar);
  }
  /* Otra pesta\u00f1a ha cambiado el tema. */
  window.addEventListener("storage", function (e) {
    if (e.key === KEY || e.key === null) aplicar();
  });
})();
</script>
<script>
(function () {
  var fp = document.getElementById("fp");
  var fpBar = document.getElementById("fp-bar");
  var fpTitle = document.getElementById("fp-title");
  var fpIframe = document.getElementById("fp-iframe");
  var fpMin = document.getElementById("fp-min");
  var fpClose = document.getElementById("fp-close");

  function openVideo(vid, title) {
    fpIframe.src = "https://www.youtube.com/embed/" + vid + "?autoplay=1";
    fpIframe.title = title;
    fpTitle.textContent = title;
    fp.hidden = false;
    fp.classList.remove("minimizado");
    aplicarModo();
  }
  function closeVideo() {
    fp.hidden = true;
    raiz.style.setProperty("--fp-dock", "0px");   // el texto recupera el sitio
    /* Cambiar el src no basta: Firefox mantiene vivo el reproductor de
       YouTube y el vídeo se sigue oyendo. Hay que sacar el iframe del
       documento y poner otro nuevo en su lugar. */
    var limpio = fpIframe.cloneNode(false);
    limpio.removeAttribute("src");
    limpio.removeAttribute("title");
    fpIframe.parentNode.replaceChild(limpio, fpIframe);
    fpIframe = limpio;
  }

  document.querySelectorAll(".video-play").forEach(function (btn) {
    btn.addEventListener("click", function () {
      openVideo(btn.dataset.vid, btn.dataset.title);
    });
  });
  fpClose.addEventListener("click", closeVideo);
  fpMin.addEventListener("click", function () {
    fp.classList.toggle("minimizado");
  });

  /* --- cambiar el tamaño del reproductor ---
     El alto lo pone el aspect-ratio 16/9 del contenedor, así que basta con
     gobernar el ancho. Se recuerda entre documentos, como el resto de
     ajustes de lectura. */
  var fpResize = document.getElementById("fp-resize");
  var ANCHO_KEY = "mit803-fp-ancho";
  var ANCHO_MIN = 220;

  /* --- dónde se coloca el reproductor ---
     Flotando tapa la columna aunque a los lados sobre sitio; acoplado, el
     texto se aparta y se puede leer mientras se ve el vídeo. */
  var raiz = document.documentElement;
  var fpDock = document.getElementById("fp-dock");
  var MODO_KEY = "mit803-fp-modo";
  var MODOS_FP = ["derecha", "izquierda", "flotante"];
  var ICONO_FP = { derecha: "\u21E5", izquierda: "\u21E4", flotante: "\u2750" };
  var NOMBRE_FP = { derecha: "acoplado a la derecha", izquierda: "acoplado a la izquierda", flotante: "flotante" };
  /* Por debajo de esto, apartar el texto lo dejaría en un hilo: sólo flotante. */
  var ANCHO_PARA_ACOPLAR = 1000;

  function modoFp() {
    var v = localStorage.getItem(MODO_KEY);
    if (MODOS_FP.indexOf(v) === -1) v = "derecha";
    if (v !== "flotante" && window.innerWidth < ANCHO_PARA_ACOPLAR) v = "flotante";
    return v;
  }

  function aplicarModo() {
    var m = modoFp();
    var acoplado = m !== "flotante";
    fp.classList.toggle("acoplado", acoplado);
    raiz.classList.toggle("fp-dock-der", m === "derecha");
    raiz.classList.toggle("fp-dock-izq", m === "izquierda");
    if (acoplado) {
      /* Un arrastre anterior deja posiciones a mano que aquí estorban. */
      fp.style.left = fp.style.top = fp.style.right = fp.style.bottom = "";
    }
    raiz.style.setProperty("--fp-dock", acoplado && !fp.hidden ? (fp.style.width || "360px") : "0px");
    if (fpDock) {
      fpDock.textContent = ICONO_FP[m];
      var t = "Reproductor " + NOMBRE_FP[m] + ". Pulsa para cambiar.";
      fpDock.title = t;
      fpDock.setAttribute("aria-label", t);
    }
  }

  if (fpDock) {
    fpDock.addEventListener("click", function () {
      var v = localStorage.getItem(MODO_KEY);
      if (MODOS_FP.indexOf(v) === -1) v = "derecha";
      localStorage.setItem(MODO_KEY, MODOS_FP[(MODOS_FP.indexOf(v) + 1) % MODOS_FP.length]);
      aplicarModo();
      fijarAncho(parseInt(fp.style.width, 10) || fp.getBoundingClientRect().width);
    });
  }

  /* Ni más ancho que la ventana ni tan alto que no quepa: el vídeo crece en
     16/9, así que un ancho grande se traduce enseguida en mucho alto. */
  function anchoMaximo() {
    var porAlto = (window.innerHeight - 32 - (fpBar.offsetHeight || 40)) * 16 / 9;
    /* Acoplado hay que dejarle sitio al texto; flotante puede ocupar casi todo. */
    var porAncho = fp.classList.contains("acoplado")
      ? window.innerWidth - 420
      : window.innerWidth - 32;
    return Math.max(ANCHO_MIN, Math.min(porAncho, porAlto));
  }

  /* Al crecer podría irse fuera de la pantalla, y con él el tirador. */
  function mantenerDentro() {
    if (fp.classList.contains("acoplado")) return;
    if (!fp.style.left) return;   // sigue anclado abajo a la derecha
    var r = fp.getBoundingClientRect();
    fp.style.left = Math.max(0, Math.min(parseFloat(fp.style.left), window.innerWidth - r.width)) + "px";
    fp.style.top = Math.max(0, Math.min(parseFloat(fp.style.top), window.innerHeight - r.height)) + "px";
  }

  function fijarAncho(px) {
    px = Math.max(ANCHO_MIN, Math.min(Math.round(px), anchoMaximo()));
    fp.style.width = px + "px";
    mantenerDentro();
    /* Acoplado, la banda que se reserva al texto es el ancho del panel. */
    if (fp.classList.contains("acoplado") && !fp.hidden) {
      raiz.style.setProperty("--fp-dock", px + "px");
    }
    return px;
  }

  var anchoGuardado = parseInt(localStorage.getItem(ANCHO_KEY), 10);
  if (anchoGuardado) fijarAncho(anchoGuardado);

  /* Si la ventana se encoge, el reproductor no puede quedarse más ancho. */
  window.addEventListener("resize", function () {
    aplicarModo();   // una ventana estrecha ya no admite acoplado
    if (fp.style.width) fijarAncho(parseInt(fp.style.width, 10));
  });

  aplicarModo();

  if (fpResize) {
    fpResize.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      /* Con la captura del puntero el arrastre sigue funcionando aunque el
         cursor entre en el iframe, que si no se quedaría los eventos. */
      fpResize.setPointerCapture(e.pointerId);
      var r = fp.getBoundingClientRect();
      if (!fp.classList.contains("acoplado")) {
        /* Anclado por la derecha, ensanchar lo desplazaría; se ancla por la
           esquina superior izquierda mientras dura el arrastre. */
        fp.style.right = "auto";
        fp.style.bottom = "auto";
        fp.style.left = r.left + "px";
        fp.style.top = r.top + "px";
      }
      var x0 = e.clientX, w0 = r.width;
      /* Acoplado a la derecha el tirador está en el borde izquierdo, así que
         el panel crece cuando el puntero va hacia la izquierda. */
      var signo = raiz.classList.contains("fp-dock-der") ? -1 : 1;

      function mover(ev) { fijarAncho(w0 + signo * (ev.clientX - x0)); }
      function soltar() {
        fpResize.removeEventListener("pointermove", mover);
        fpResize.removeEventListener("pointerup", soltar);
        fpResize.removeEventListener("pointercancel", soltar);
        localStorage.setItem(ANCHO_KEY, parseInt(fp.style.width, 10));
      }
      fpResize.addEventListener("pointermove", mover);
      fpResize.addEventListener("pointerup", soltar);
      fpResize.addEventListener("pointercancel", soltar);
    });

    /* Doble clic en el tirador: vuelve al tamaño de partida. */
    fpResize.addEventListener("dblclick", function () {
      fp.style.width = "";
      localStorage.removeItem(ANCHO_KEY);
    });
  }

  /* arrastrar el reproductor flotante */
  var dragging = false, offX = 0, offY = 0;
  function startDrag(x, y) {
    dragging = true;
    var r = fp.getBoundingClientRect();
    offX = x - r.left;
    offY = y - r.top;
    fp.style.right = "auto";
    fp.style.bottom = "auto";
    fp.style.left = r.left + "px";
    fp.style.top = r.top + "px";
  }
  function moveDrag(x, y) {
    if (!dragging) return;
    var w = fp.offsetWidth, h = fp.offsetHeight;
    var left = Math.min(Math.max(0, x - offX), window.innerWidth - w);
    var top = Math.min(Math.max(0, y - offY), window.innerHeight - h);
    fp.style.left = left + "px";
    fp.style.top = top + "px";
  }
  function endDrag() { dragging = false; }

  fpBar.addEventListener("mousedown", function (e) {
    if (fp.classList.contains("acoplado")) return;   // acoplado no se mueve
    startDrag(e.clientX, e.clientY);
  });
  window.addEventListener("mousemove", function (e) { moveDrag(e.clientX, e.clientY); });
  window.addEventListener("mouseup", endDrag);

  fpBar.addEventListener("touchstart", function (e) {
    if (fp.classList.contains("acoplado")) return;
    var t = e.touches[0]; startDrag(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener("touchmove", function (e) {
    var t = e.touches[0]; moveDrag(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener("touchend", endDrag);
})();
</script>
