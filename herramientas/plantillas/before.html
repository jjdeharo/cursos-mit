<div class="fp" id="fp" hidden>
<div class="fp-bar" id="fp-bar">
<span class="fp-title" id="fp-title">Vídeo</span>
<div class="fp-actions">
<button type="button" id="fp-min" title="Minimizar/restaurar">&#8211;</button>
<button type="button" id="fp-close" title="Cerrar">&times;</button>
</div>
</div>
<div class="fp-body" id="fp-body">
<div class="video-wrapper"><iframe id="fp-iframe" src="" title="" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
</div>
</div>
<button type="button" class="theme-toggle" id="theme-toggle" title="Cambiar el tema" aria-label="Cambiar el tema">🌗</button>
<button type="button" class="a11y-toggle" id="a11y-toggle" title="Ajustes de lectura" aria-label="Ajustes de lectura">Aa</button>
<div class="a11y-panel" id="a11y-panel">
  <div class="a11y-row">
    <span class="a11y-label">Tamaño de texto</span>
    <div class="a11y-btns" data-group="fontscale">
      <button type="button" data-value="down">A&minus;</button>
      <button type="button" data-value="reset">A</button>
      <button type="button" data-value="up">A+</button>
    </div>
  </div>
  <div class="a11y-row">
    <span class="a11y-label">Interlineado</span>
    <div class="a11y-btns" data-group="lineheight">
      <button type="button" data-value="1.35">Compacto</button>
      <button type="button" data-value="1.6">Normal</button>
      <button type="button" data-value="2.0">Amplio</button>
    </div>
  </div>
  <div class="a11y-row">
    <span class="a11y-label">Tipografía</span>
    <div class="a11y-btns" data-group="fontfamily">
      <button type="button" data-value="serif">Serif</button>
      <button type="button" data-value="sans">Sans</button>
    </div>
  </div>
  <div class="a11y-row">
    <span class="a11y-label">Ancho de columna</span>
    <div class="a11y-btns" data-group="width">
      <button type="button" data-value="640">Estrecho</button>
      <button type="button" data-value="860">Normal</button>
      <button type="button" data-value="1100">Ancho</button>
    </div>
  </div>
</div>
